name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npx eslint src api scripts --ext .js,.jsx,.mjs

      - name: Tests
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Build y prerender
        run: npm run build
        env:
          CI: false

      # El prerender es la razon de ser del build: si algun dia deja de inyectar
      # el HTML dentro de #root, la web vuelve a servir un div vacio y nadie se
      # entera hasta que un reclutador no ve nada. El guardian vive en
      # scripts/check-prerender.mjs para poder correrlo tambien a mano.
      - name: Comprobar el HTML generado
        run: node scripts/check-prerender.mjs
